.lvl[aria-pressed="true"] { background: var(--gold); color: var(--ink); border-color: var(--ink); box-shadow: 0 2px 0 var(--gold-dark); }
.lvl[aria-pressed="true"] .n { color: var(--ink); }
.lvl .n { font: 900 calc(22px * var(--text-scale)) var(--font-head); color: var(--gold); }
.lvl .st { color: var(--gold); letter-spacing: 1px; }
.lvl .st .t3 { color: #7FD6C8; }
.lvl .st .t4 { color: #FF9B6A; }
.lvl .tier { font-size: 0.8em; opacity: 0.9; letter-spacing: 0.04em; }
.banked { margin: 6px 0; }
.nutrow.pack { flex-wrap: wrap; row-gap: 4px; }
.nutrow.pack .what { flex: 1 1 120px; min-width: 0; }
.nutrow.pack .steps { display: flex; gap: 8px; margin-left: auto; }
.nutrow.pack .what { margin-right: 0; }
.nutrow.pack .price { margin-left: 0; }
.nutrow.pack .btn { width: auto; min-width: 64px; min-height: 44px; }
.nutrow.pack .btn[data-act="prepBuy"] { width: 112px; }
.lvl[disabled] { opacity: 1; background: #2E251C; color: #D8CCB0; border-style: dashed; }
.lvl[disabled] .n { color: #B8A888; }
@media (max-width: 520px) { .map { grid-template-columns: repeat(3, 1fr); } .panel { padding: 16px 14px 14px; } .panel h2 { font-size: calc(26px * var(--text-scale)); } .logo h1 { font-size: calc(42px * var(--text-scale)); } }

.nutrow small, .card { font-size: calc(14px * var(--text-scale)); }
.panel .cards { margin-bottom: 8px; }
.card { color: #F5E9D0; }

.nutrow .btn { width: 112px; flex: none; text-align: center; white-space: nowrap; }
.res-sq { margin-bottom: 14px; }
.help-more { display: block; position: absolute; left: 18px; top: 16px; text-align: center; font-weight: 800; color: var(--gold); animation: bob 1.2s ease-in-out infinite; }
@keyframes bob { 50% { transform: translateY(4px); } }
body.reduced .help-more { animation: none; }

.menu.sticky { position: sticky; }
.menu.sticky .help-more { position: static; margin-right: auto; }
.fineprint { font-size: calc(12px * var(--text-scale)); opacity: 0.92; }

/* disabled HUD controls stay legible (input is locked during flight, not hidden) */
.hud .btn[disabled], .hud .nut[disabled] { opacity: 0.72; filter: saturate(0.7); }
.panel .menu.row:last-child { position: sticky; bottom: -18px; background: var(--sign); padding-top: 10px; padding-bottom: 6px; margin-bottom: -6px; }


/* ---------- records and "New best!" ---------- */
.starcount { margin: 4px 0; }
.newbest { margin: 6px 0; padding: 6px 12px; border-radius: 12px; background: #3E3226; border: 2px solid var(--gold); color: #FFF6C8; }
.newbest b { color: var(--gold); }
.lvl .best { font-size: 0.82em; opacity: 0.92; }
.rec-table { display: grid; gap: 2px; }
.rec-row { display: grid; grid-template-columns: minmax(0, 1.4fr) auto minmax(0, 1.1fr); align-items: center; gap: 4px 10px; padding: 6px 4px; border-bottom: 1px solid rgba(237,227,200,0.15); font-size: calc(14px * var(--text-scale)); }
.rec-row .st { color: var(--gold); letter-spacing: 1px; white-space: nowrap; }
.rec-row .st .t3 { color: #7FD6C8; }
.rec-row .st .t4 { color: #FF9B6A; }
.rec-row .rb { text-align: right; }
@media (max-width: 520px) { .rec-row { grid-template-columns: 1fr auto; } .rec-row .rn { grid-column: 1 / -1; font-weight: 700; } .rec-row .rb { text-align: right; } }
.starcount.row { display: flex; align-items: center; justify-content: space-between; gap: 10px; }

/* ---------- the feud's voice (S4-01) ---------- */
.titlecard, .taunt { position: absolute; left: 50%; transform: translateX(-50%); pointer-events: none; text-align: center; opacity: 0; transition: opacity 0.5s; }
.titlecard { bottom: 120px; width: min(92vw, 460px); padding: 12px 18px; border-radius: 16px; background: rgba(42,33,25,0.92); border: 3px solid var(--ink); color: #fff; }
.titlecard b { display: block; font: 900 calc(22px * var(--text-scale)) / 1.1 var(--font-head); color: #FFF6C8; }
.titlecard span { display: block; margin-top: 4px; font: 600 calc(15px * var(--text-scale)) / 1.3 var(--font-ui); }
.titlecard small { display: block; margin-top: 4px; font: 700 calc(12px * var(--text-scale)) var(--font-ui); color: var(--gold); }
.titlecard.show, .taunt.show { opacity: 1; }
.taunt { top: calc(17% + 62px); width: max-content; max-width: 92vw; padding: 6px 16px; border-radius: 14px; background: var(--rust-dark); border: 2px solid var(--ink); color: #fff; font: 800 calc(16px * var(--text-scale)) var(--font-ui); }
body.reduced .titlecard, body.reduced .taunt { transition: none; }
@media (max-width: 700px) { .taunt { top: calc(30% + 56px); }  }
.blurb .where { display: block; margin-top: 3px; font-style: normal; font-size: 0.85em; color: var(--gold); }
.blurb { margin: 6px 0 2px; padding: 6px 12px; border-radius: 12px; background: #3E3226; border: 2px solid var(--sign-edge); color: #F5E9D0; font-style: italic; min-height: 3.2em; }
.feudline { margin: 6px 0; font-family: var(--font-serif); font-size: calc(17px * var(--text-scale)); font-style: italic; color: #FFF6C8; }
.finale { display: flex; align-items: flex-end; justify-content: center; gap: 10px; margin: -10px 0 10px; padding: 14px 8px 6px; border-radius: 16px; background: linear-gradient(#5B3B6E 0%, #C2573A 55%, #F2A547 100%); border: 3px solid var(--sign-edge); overflow: hidden; }
.finale > canvas { width: 84px; height: 84px; flex: none; }
.finale .pile { display: flex; flex-direction: column; align-items: center; margin-bottom: 4px; }
.finale .pile div { display: flex; justify-content: center; margin-top: -10px; }
.finale .pile canvas { width: 38px; height: 38px; }
.finale-text h3 { margin: 10px 0 4px; }
.finale-text p { margin: 4px 0; font-family: var(--font-serif); }
@media (max-width: 520px) { .finale > canvas { width: 64px; height: 64px; } .finale .pile canvas { width: 32px; height: 32px; } }
.call, .hint { width: max-content; }

/* ---------- the Field Notes journal (S4-17) ---------- */
.postcards { display: grid; grid-template-columns: repeat(auto-fill, minmax(132px, 1fr)); gap: 10px; margin: 8px 0; }
.postcard { margin: 0; padding: 4px 4px 6px; border-radius: 6px; background: #F6F0DC; color: #2B2A27; border: 2px solid var(--sign-edge); text-align: center; font: 700 calc(12.5px * var(--text-scale)) / 1.2 var(--font-ui); transform: rotate(-0.8deg); }
.postcard:nth-child(even) { transform: rotate(0.8deg); }
.postcard canvas, .postcard .blank { display: block; width: 100%; aspect-ratio: 3 / 2; background: #2A2119; }
.postcard .blank { display: flex; align-items: center; justify-content: center; color: #B8A888; font-size: calc(20px * var(--text-scale)); }
.postcard figcaption { margin-top: 4px; }
.postcard.locked { background: #2E251C; color: #D8CCB0; border-style: dashed; }
body.reduced .postcard, body.reduced .postcard:nth-child(even) { transform: none; }
.note-list { list-style: none; margin: 0; padding: 0; }
.note-list li { margin: 6px 0; padding: 8px 12px; border-radius: 12px; font-size: calc(15px * var(--text-scale)); line-height: 1.4; }
.note-list li.found { background: #F6F0DC; color: #2B2A27; border: 2px solid var(--sign-edge); font-family: var(--font-serif); }
.note-list li.found p { margin: 0; font-size: inherit; }
.note-list .src { display: block; margin-top: 4px; font: 600 calc(12.5px * var(--text-scale)) var(--font-ui); color: #4A4038; }
.note-list li.locked { background: #2E251C; color: #D8CCB0; border: 2px dashed var(--sign-edge); font-family: var(--font-ui); }
.rec-row.day { grid-template-columns: 1fr auto; }
.rec-row.day .rn { grid-column: auto; font-weight: 400; }

</style>
</head>

  <script>const FACTS = {"landmarks":[{"id":"hs-0066","stretch":"north","text":"Concrete on the facade is painted to imitate ornamental tile.","q":"What color are the tile medallions on the Superior Bathhouse facade?","a":"Green","source":"Wikipedia: Bathhouse Row","url":"https://en.wikipedia.org/wiki/Bathhouse_Row"},{"id":"hs-0102","stretch":"north","text":"The Superior Bathhouse Brewery and Distillery has occupied the Superior Bathhouse since 2012.","q":"Which Bathhouse Row bathhouse now houses a brewery and distillery?","a":"The Superior","source":"Wikipedia: Hot Springs, Arkansas","url":"https://en.wikipedia.org/wiki/Hot_Springs,_Arkansas"},{"id":"hs-0061","stretch":"north","text":"EoA calls the Hale, built in 1892-93, the oldest surviving bathhouse; the Buckstaff (1912), Fordyce (1914-15) and Lamar (1923) came later.","q":"Which is the oldest surviving bathhouse on Hot Springs' Bathhouse Row?","a":"The Hale","source":"Encyclopedia of Arkansas: Bathhouse Row","url":"https://encyclopediaofarkansas.net/entries/bathhouse-row-437/"},{"id":"hs-0080","stretch":"north","text":"Thompson, Sanders & Ginocchio's late-1930s remodel changed the facade from neo-Classical revival to Mission Style in 1939-40.","q":"In what architectural style was the Hale Bathhouse facade remodeled in 1939–40?","a":"Mission","source":"Wikipedia: Bathhouse Row","url":"https://en.wikipedia.org/wiki/Bathhouse_Row"},{"id":"hs-0081","stretch":"middle","text":"The pool was installed in 1931 to treat paralysis; the Maurice was the only bathhouse to employ a registered physical therapist.","q":"What was the Maurice Bathhouse's 1931 therapeutic pool built for?","a":"Therapy for paralysis patients","source":"Wikipedia: Bathhouse Row","url":"https://en.wikipedia.org/wiki/Bathhouse_Row"},{"id":"hs-0093","stretch":"middle","text":"The Fordyce reopened as the visitor center on May 13, 1989.","q":"Which Bathhouse Row building houses Hot Springs National Park's visitor center and museum?","a":"The Fordyce","source":"Encyclopedia of Arkansas: Hot Springs National Park","url":"https://encyclopediaofarkansas.net/entries/hot-springs-national-park-2547/"},{"id":"hs-0082","stretch":"middle","text":"Its chevron-mosaic dome is topped by a small copper cupola.","q":"Which Bathhouse Row bathhouse is crowned by a large tiled dome?","a":"The Quapaw","source":"Wikipedia: Bathhouse Row","url":"https://en.wikipedia.org/wiki/Bathhouse_Row"},{"id":"hs-0084","stretch":"middle","text":"Scalloped shells frame the sculpin, originally gold and now white.","q":"Which fish decorates the parapets of Hot Springs' Quapaw Bathhouse?","a":"Sculpin","source":"Wikipedia: Bathhouse Row","url":"https://en.wikipedia.org/wiki/Bathhouse_Row"},{"id":"hs-0085","stretch":"south","text":"The 1922 Spanish Colonial Revival design has a vague Art Deco look.","q":"Which Bathhouse Row bathhouse has twin towers with three-tiered setbacks?","a":"The Ozark","source":"Wikipedia: Bathhouse Row","url":"https://en.wikipedia.org/wiki/Bathhouse_Row"},{"id":"hs-0062","stretch":"south","text":"NPS says the Buckstaff opened on February 1, 1912, and has been in continuous operation since.","q":"Which Bathhouse Row bathhouse has offered baths continuously since 1912?","a":"The Buckstaff","source":"NPS: Buckstaff Bathhouse","url":"https://www.nps.gov/hosp/learn/historyculture/buckstaff-bathhouse.htm"},{"id":"hs-0069","stretch":"south","text":"Cream brick with white stucco trim and brass \"Buckstaff Baths\" letters.","q":"What color is the brick of the Buckstaff Bathhouse?","a":"Cream","source":"Wikipedia: Bathhouse Row","url":"https://en.wikipedia.org/wiki/Bathhouse_Row"},{"id":"hs-0077","stretch":"south","text":"NPS: the final metamorphosis of Bathhouse Row was completed when the Lamar opened in 1923; it closed in 1985.","q":"Which bathhouse's 1923 opening completed Hot Springs' Bathhouse Row?","a":"The Lamar","source":"NPS: History & Culture","url":"https://www.nps.gov/hosp/learn/historyculture/index.htm"},{"id":"hs-0086","stretch":"any","text":"Work began in the 1930s on the promenade behind the bathhouses, which was finally completed in the early 1960s.","q":"In what decade did construction begin on the Grand Promenade behind Bathhouse Row?","a":"The 1930s","source":"Wikipedia: Bathhouse Row","url":"https://en.wikipedia.org/wiki/Bathhouse_Row"},{"id":"hs-0094","stretch":"north","text":"The lattice steel observation tower was officially opened to the public on June 3, 1983.","q":"How tall is the Hot Springs Mountain Tower?","a":"216 feet","source":"Wikipedia: Hot Springs Mountain Tower","url":"https://en.wikipedia.org/wiki/Hot_Springs_Mountain_Tower"},{"id":"hs-0099","stretch":"north","text":"Construction began in 1982; it opened June 3, 1983.","q":"In what month and year did the current Hot Springs Mountain Tower open?","a":"June 1983","source":"Wikipedia: Hot Springs Mountain Tower","url":"https://en.wikipedia.org/wiki/Hot_Springs_Mountain_Tower"},{"id":"hs-0071","stretch":"north","text":"The steel Rix Tower, opened in 1906, had an elevator to carry visitors to the top.","q":"What was the steel observation tower that preceded today's Hot Springs Mountain Tower called?","a":"The Rix Tower","source":"NPS: Hot Springs Mountain Tower","url":"https://www.nps.gov/places/hot-springs-mountain-tower.htm"}],"nature":[{"id":"n-squirrels-park","season":"any","text":"Both families are real neighbors: the park's species list counts the eastern gray squirrel as present and the fox squirrel as probably present.","source":"NPS NPSpecies, Hot Springs National Park mammals","url":"https://irmaservices.nps.gov/v3/rest/npspecies/checklist/HOSP/Mammal"},{"id":"n-size","season":"any","text":"Fox squirrels are the bigger cousins: about 1½–2 lb in Arkansas, while gray squirrels weigh just over a pound.","source":"University of Arkansas Cooperative Extension","url":"https://uaex.uada.edu/environment-nature/musings-on-nature-blog/posts/squirrels.aspx"},{"id":"n-dreys","season":"any","text":"A squirrel's leaf nest sits about 40 feet up, is 12–20 inches across, and can be built in under 12 hours.","source":"Missouri Department of Conservation","url":"https://mdc.mo.gov/discover-nature/field-guide/eastern-gray-squirrel-and-eastern-fox-squirrel"},{"id":"n-planters","season":"fall","text":"Gray squirrels bury nuts one at a time and never find them all, so they plant new trees every fall.","source":"University of Arkansas Cooperative Extension","url":"https://uaex.uada.edu/environment-nature/musings-on-nature-blog/posts/squirrels.aspx"},{"id":"n-mast","season":"fall","text":"Oak and hickory nuts in the region fall in September and October. Red-oak acorns take two years to ripen; white oak acorns take one.","source":"Missouri Department of Conservation tree guide","url":"https://mdc.mo.gov/discover-nature/field-guide/white-oak"},{"id":"n-pine","season":"winter","text":"Squirrels snip shortleaf pine cones and eat the seeds before the cones even open.","source":"USDA Forest Service, Silvics of North America","url":"https://research.fs.usda.gov/silvics/shortleaf-pine"},{"id":"n-hedgeapple","season":"fall","text":"Hedge apples (Osage-orange) are native to the Red River country of Oklahoma, Texas and Arkansas. Squirrels tear them open for the seeds.","source":"Missouri Department of Conservation","url":"https://mdc.mo.gov/discover-nature/field-guide/osage-orange"},{"id":"n-gumball","season":"winter","text":"Sweetgum \"gumballs\" aren't nuts: they are spiky 1–1½ inch seed balls that ripen in fall and hang on all winter.","source":"Missouri Department of Conservation","url":"https://mdc.mo.gov/discover-nature/field-guide/sweet-gum"},{"id":"n-chinquapin","season":"summer","text":"The Ozark chinquapin still grows in the park but is rare: chestnut blight reached it by 1940, and volunteers now breed blight-resistant trees.","source":"University of Arkansas Cooperative Extension","url":"https://uaex.uada.edu/yard-garden/resource-library/plant-week/chinquapin-ozark.aspx"},{"id":"n-fallcolor","season":"fall","text":"In fall, hickories turn golden yellow and sweetgums go red, orange, maroon and purple.","source":"Missouri Department of Conservation","url":"https://mdc.mo.gov/discover-nature/field-guide/shagbark-hickory"},{"id":"n-redbud","season":"spring","text":"Redbuds bloom pink to reddish purple from March before their leaves come out; flowering dogwood follows with white bracts.","source":"USDA Forest Service, Silvics of North America","url":"https://research.fs.usda.gov/silvics/eastern-redbud"},{"id":"n-wind","season":"any","text":"Hot Springs breezes are gentle: at Memorial Field the wind averages about 5 mph and blows from the east more than any other direction (2016–2025 records).","source":"Iowa Environmental Mesonet ASOS archive (computed)","url":"https://mesonet.agron.iastate.edu/request/download.phtml?network=AR_ASOS"},{"id":"n-birds-park","season":"any","text":"Every bird that flies over these battles is on Hot Springs National Park's species list, from chimney swifts to bald eagles.","source":"NPS NPSpecies, Hot Springs National Park birds","url":"https://irmaservices.nps.gov/v3/rest/npspecies/checklist/HOSP/Bird"},{"id":"n-jays","season":"fall","text":"A blue jay can carry five acorns at once and bury up to 5,000 in a season, but finds only about one in four, so jays plant oak trees.","source":"National Park Service, Species Spotlight: Oaks","url":"https://www.nps.gov/articles/species-spotlight-oaks.htm"},{"id":"n-vultures","season":"any","text":"Turkey vultures ride rising warm air, holding their wings in a shallow V and tilting side to side. Their wings span about 70 inches.","source":"Missouri Department of Conservation","url":"https://mdc.mo.gov/discover-nature/field-guide/turkey-vulture"},{"id":"n-swifts","season":"summer","text":"Chimney swifts look like flying cigars and catch insects on the wing. They arrive in April and leave for South America in October.","source":"Missouri Department of Conservation","url":"https://mdc.mo.gov/discover-nature/field-guide/chimney-swift"},{"id":"n-waxwings","season":"winter","text":"Cedar waxwings travel in big, quiet flocks and eat cedar berries in winter. Look for the yellow tips on their tails.","source":"Missouri Department of Conservation","url":"https://mdc.mo.gov/discover-nature/field-guide/cedar-waxwing"},{"id":"n-geese","season":"fall","text":"Migrating Canada geese fly in V-shaped chevrons, and the males call a long, loud \"a-honk!\"","source":"Missouri Department of Conservation","url":"https://mdc.mo.gov/discover-nature/field-guide/canada-goose"},{"id":"n-eagles","season":"winter","text":"Arkansas's first modern bald eagle nest was found in 1983; now about 150–160 pairs nest in the state, and winter is the best time to spot one.","source":"Arkansas Game & Fish Commission","url":"https://www.agfc.com/news/eagles-inspire-awe-appreciation-for-conservation-efforts/"}]};</script>

  const set = App.save.settings.aimGuide;
  let frac = App.setup.mode === 'practice' ? 1 : set === 'always' ? 0.6 : set === 'off' ? 0 : GUIDE[App.setup.difficulty || 'medium'] ?? 0.22;
  App.shotTrail = set !== 'off' && App.lastShot && App.lastShot.pts.length > 1 ? App.lastShot.pts : null;
  if (!frac) { App.aimGuide = null; return; }
  const aim = b.teams[b.turn.team].aim, q = sim.active();
  const aloft = (b.birds || []).some((x) => !x.flee), key = [aim.nut, aim.angle, aim.power, q.x, q.y, b.wind, b.turn.n, frac, aloft ? Math.round(b.birdT * 15) : 0].join(',');
  if (key === App.guideKey) return;
  App.guideKey = key;
  let pr = sim.preview(aim, { every: 4, squirrels: false, birds: aloft }), bird = null;
  if (pr.impact && pr.impact.type === 'bird') {
    bird = { x: pr.impact.bx, y: pr.impact.by, kind: sim.b.birds[pr.impact.bird].k };
    pr = sim.preview(aim, { every: 4, squirrels: false });
  }
  const n = Math.max(2, Math.round(pr.pts.length * frac));
  App.aimGuide = { pts: pr.pts.slice(1, n), bird };
}

function showError(err) {
  console.error(err);
  const el = document.getElementById('boot-error');
  el.hidden = false; el.textContent = 'Something went wrong: ' + (err && err.message ? err.message : err) + ' ';
  const b = document.createElement('button'); b.type = 'button'; b.className = 'btn small'; b.textContent = 'Back to menu';
  b.addEventListener('click', backToMenu);
  el.append(b);
}
function backToMenu() {
  const el = document.getElementById('boot-error');
  el.hidden = true; el.textContent = ''; errorKicked = false;
  App.sim = null; App.aiActive = null; App.pendingEnd = null; App.paused = false;
  try { showTitle(); } catch (err) { showError(err); }
}
window.addEventListener('error', (e) => showError(e.error || e.message));
window.addEventListener('unhandledrejection', (e) => showError(e.reason));

window.addEventListener('resize', () => kick());
document.addEventListener('visibilitychange', () => { handleVisibility(document.hidden); kick(); });
window.addEventListener('pagehide', () => handleVisibility(true));
window.addEventListener('pageshow', () => handleVisibility(document.hidden));

installHooks(App, {
  stepOnce, startBattle, showTitle, rivalTier, frameCamera, battleOver, planTurn, hashBattle, ALL, STORY, persist, applySettings,
  idle: () => App.ready && App.loading === 0 && !(App.sim && App.sim.busy() && App.scene === 'battle') && !App.aiActive && !App.pendingEnd && !App.busy,
});
try {
  applySettings();
  loadSprites();
  loadSoil();
  initAudio(App.save.settings);
  showTitle();
  if (!storageWorks()) tellUnsaved();
  App.ready = true;
  document.body.dataset.ready = '1';
} catch (err) { showError(err); }


return { audioState, SQ_UP };
})();
</script>
